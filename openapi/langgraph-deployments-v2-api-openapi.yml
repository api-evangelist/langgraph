          type: integer
          maximum: 100
          minimum: 1
          description: Maximum number of resources to return.
          default: 20
          title: Limit
        description: Maximum number of resources to return.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Pagination offset. Pass this value to subsequent requests to fetch the next page of resources.
