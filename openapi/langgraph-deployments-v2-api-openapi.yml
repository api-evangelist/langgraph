        core_memory_mb:
          anyOf:
          - type: integer
          - type: 'null'
          title: Core API Memory (MB)
          description: Memory request (MB) for the core API process. If core_memory_limit_mb is not set, limit defaults to 2x this value.
        core_memory_limit_mb:
          anyOf:
          - type: integer
          - type: 'null'
          title: Core API Memory Limit (MB)
          description: Memory limit (MB) for the core API process. If not set, defaults to 2x core_memory_mb.
        labels:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
