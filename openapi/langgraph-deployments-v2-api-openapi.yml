components:
  schemas:
    Revision:
      properties:
        id:
          type: string
          format: uuid
          title: ID
          description: The ID of the revision.<br><br>This is a read-only field.
        created_at:
          type: string
          format: date-time
          title: Created At
          description: The creation time of the revision.<br><br>This is a read-only field.
        updated_at:
          type: string
          format: date-time
          title: Updated At
          description: The last update time of the revision.<br><br>This is a read-only field.
        status:
          type: string
          enum:
          - CREATING
          - QUEUED
          - AWAITING_BUILD
          - BUILDING
          - AWAITING_DEPLOY
          - DEPLOYING
          - CREATE_FAILED
          - BUILD_FAILED
          - DEPLOY_FAILED
          - DEPLOYED
          - SKIPPED
          - INTERRUPTED
          - UNKNOWN
          title: Status
          description: The status of the revision.<br><br>This is a read-only field.
        status_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Status Message
          description: Human-readable detail about the current status, such as why a build or deploy failed.<br><br>This is a read-only field.
        source:
          type: string
          enum:
          - github
          - external_docker
          - internal_docker
          - internal_source
          - internal_template
          title: Source
          description: Deploy from a GitHub repository (`github`), an external Docker image (`external_docker`), a CLI-pushed image (`internal_docker`), uploaded source (`internal_source`), or a prebuilt LangChain template (`internal_template`).<br><br>Deploying from GitHub, internal Docker, internal source, or a template is only available for Cloud SaaS deployments. Deploying from an external Docker image is only available for self-hosted deployments. This cannot be changed once the deployment is created.
        source_revision_config:
          $ref: '#/components/schemas/SourceRevisionConfig'
      type: object
      required:
      - id
      - created_at
      - updated_at
      - status
      - source
      - source_revision_config
      title: Revision
      description: Revision resource.
    HPAScalingRules:
      properties:
        stabilization_window_seconds:
          anyOf:
          - type: integer
            maximum: 3600.0
            minimum: 0.0
          - type: 'null'
          title: Stabilization Window Seconds
          description: Seconds of past recommendations considered before scaling. Between 0 and 3600 (one hour). Required in a scaling override.
        select_policy:
          anyOf:
          - type: string
            enum:
            - Max
            - Min
            - Disabled
          - type: 'null'
          title: Select Policy
          description: 'Which policy to apply when several allow a change: Max, Min, or Disabled to turn this direction off. Required in a scaling override.'
        policies:
          anyOf:
          - items:
              $ref: '#/components/schemas/HPAScalingPolicy'
            type: array
            minItems: 1
          - type: 'null'
          title: Policies
          description: Scaling policies that may be used while scaling in this direction. At least one policy is required in a scaling override.
      additionalProperties: false
      type: object
      title: HPAScalingRules
      description: HorizontalPodAutoscaler scaling rules for one direction (scale up or scale down).
    ResourceSpec-Output:
      properties:
        min_scale:
          anyOf:
          - type: integer
          - type: 'null'
          title: Min Scale
          description: The minimum scale (number of replicas) of the deployment.
        max_scale:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Scale
          description: The maximum scale (number of replicas) of the deployment.
        cpu:
          anyOf:
          - type: number
            minimum: 0.1
          - type: 'null'
          maximum: 8.0
          title: CPU
          description: CPU request in cores for a single replica of the deployment. Supports fractional values (e.g. 0.5 for 500m). Values are rounded to 1 decimal place. If cpu_limit is not set, limit defaults to 2x this value unless cpu_limit_enabled is false.
          examples:
          - 0.1
          - 0.5
          - 1
          - 2
          - 4
        cpu_limit:
          anyOf:
          - type: number
            minimum: 0.1
          - type: 'null'
          maximum: 16.0
          title: CPU Limit
          description: CPU limit in cores for a single replica of the deployment. Supports fractional values (e.g. 0.5 for 500m). Values are rounded to 1 decimal place. If not set, defaults to 2x cpu; set cpu_limit_enabled to false to run without a CPU limit.
          examples:
          - 0.2
          - 1
          - 2
          - 4
          - 8
          - 16
        memory_mb:
          anyOf:
          - type: integer
          - type: 'null'
          title: Memory (MB)
          description: Memory request (MB) of a single replica of the deployment. If memory_limit_mb is not set, limit defaults to 2x this value.
        memory_limit_mb:
          anyOf:
          - type: integer
          - type: 'null'
          title: Memory Limit (MB)
          description: Memory limit (MB) of a single replica of the deployment. If not set, defaults to 2x memory_mb.
        queue_min_scale:
          anyOf:
          - type: integer
          - type: 'null'
          title: Queue Min Scale
          description: The minimum scale (number of replicas) of the queue deployment. If not provided, defaults to the same value as `min_scale`.
        queue_max_scale:
          anyOf:
          - type: integer
          - type: 'null'
          title: Queue Max Scale
          description: The maximum scale (number of replicas) of the queue deployment. If not provided, defaults to the same value as `max_scale`.
        queue_cpu:
          anyOf:
          - type: number
            minimum: 0.1
          - type: 'null'
          maximum: 8.0
          title: Queue CPU
          description: CPU request in cores for a single replica of the queue deployment. Supports fractional values (e.g. 0.5 for 500m). Values are rounded to 1 decimal place. If not provided, defaults to the same value as `cpu`. If queue_cpu_limit is not set, limit defaults to 2x this value unless queue_cpu_limit_enabled is false.
          examples:
          - 0.1
          - 0.5
          - 1
          - 2
        queue_cpu_limit:
          anyOf:
          - type: number
            minimum: 0.1
          - type: 'null'
          maximum: 16.0
          title: Queue CPU Limit
          description: CPU limit in cores for a single replica of the queue deployment. Supports fractional values (e.g. 0.5 for 500m). Values are rounded to 1 decimal place. If not set, defaults to 2x queue_cpu; set queue_cpu_limit_enabled to false to run without a CPU limit.
          examples:
          - 0.2
          - 1
          - 2
          - 4
          - 8
        queue_memory_mb:
          anyOf:
          - type: integer
          - type: 'null'
          title: Queue Memory (MB)
          description: Memory request (MB) of a single replica of the queue deployment. If not provided, defaults to the same value as `memory_mb`. If queue_memory_limit_mb is not set, limit defaults to 2x this value.
        queue_memory_limit_mb:
          anyOf:
          - type: integer
          - type: 'null'
          title: Queue Memory Limit (MB)
          description: Memory limit (MB) of a single replica of the queue deployment. If not set, defaults to 2x queue_memory_mb.
        redis_cpu:
          anyOf:
          - type: number
            minimum: 0.1
          - type: 'null'
          maximum: 8.0
          title: Redis CPU
          description: CPU request in cores for the Redis deployment. Supports fractional values (e.g. 0.5 for 500m). Values are rounded to 1 decimal place. If redis_cpu_limit is not set, limit defaults to 2x this value.
          examples:
          - 0.1
          - 0.5
          - 1
          - 2
        redis_cpu_limit:
          anyOf:
          - type: number
            minimum: 0.1
          - type: 'null'
          maximum: 16.0
          title: Redis CPU Limit
          description: CPU limit in cores for the Redis deployment. Supports fractional values (e.g. 0.5 for 500m). Values are rounded to 1 decimal place. If not set, defaults to 2x redis_cpu.
          examples:
          - 0.2
          - 1
          - 2
          - 4
          - 8
        redis_memory_mb:
          anyOf:
          - type: integer
          - type: 'null'
          title: Redis Memory Mb
          description: Memory request (MB) of the Redis deployment. If redis_memory_limit_mb is not set, limit defaults to this value.
        redis_memory_limit_mb:
          anyOf:
          - type: integer
          - type: 'null'
          title: Redis Memory Limit (MB)
          description: Memory limit (MB) of the Redis deployment. If not set, defaults to redis_memory_mb.
        core_cpu:
          anyOf:
          - type: number
            minimum: 0.1
          - type: 'null'
          title: Core API CPU
          description: CPU request in cores for the core API process (only used when the deployment runs the core API as a sidecar). If core_cpu_limit is not set, limit defaults to 2x this value.
        core_cpu_limit:
          anyOf:
          - type: number
            minimum: 0.1
          - type: 'null'
          title: Core API CPU Limit
          description: CPU limit in cores for the core API process. If not set, defaults to 2x core_cpu.
        core_memory_mb:
          anyOf:
          - type: integer
          - type: 'null'
          title: Core API Memory (MB)
          description: Memory request (MB) for the core API process. If core_memory_limit_mb is not set, limit defaults to 2x this value.
        core_memory_limit_mb:
          anyOf:
          - type: integer
          - type: 'null'
          title: Core API Memory Limit (MB)
          description: Memory limit (MB) for the core API process. If not set, defaults to 2x core_memory_mb.
        labels:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Labels
          description: Additional labels to apply to resources created for the deployment.
        annotations:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Annotations
          description: Additional annotations to apply to resources created for the deployment.
        service_account_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Service Account Name
          description: The name of the service account to use for the deployment.<br><br>This must already exist in the Kubernetes namespace where the deployment will be deployed to.
        image_pull_secrets:
          anyOf:
          - items:
              $ref: '#/components/schemas/LocalObjectReference'
            type: array
          - type: 'null'
          title: Image Pull Secrets
          description: List of references to secrets in the same namespace to use for pulling container images. Each entry is a LocalObjectReference to a Secret of type kubernetes.io/dockerconfigjson.
        volumes:
          anyOf:
          - items:
              $ref: '#/components/schemas/Volume'
            type: array
          - type: 'null'
          title: Volumes
          description: List of volumes that can be mounted by containers belonging to the pod. Reference the kubernetes documentation for more details on how to configure volumes.
        volume_mounts:
          anyOf:
          - items:
              $ref: '#/components/schemas/VolumeMount'
            type: array
          - type: 'null'
          title: Volume Mounts
          description: Pod volumes to mount into the container's filesystem. Reference the kubernetes documentation for more details on how to configure volume mounts.
        init_containers:
          anyOf:
          - items:
              $ref: '#/components/schemas/Container'
            type: array
          - type: 'null'
          title: Init Containers
          description: List of initialization containers belonging to the pod. Init containers are set as initContainers in the pod spec and run to completion before the main application container starts.
        sidecars:
          anyOf:
          - items:
              $ref: '#/components/schemas/Container'
            type: array
          - type: 'null'
          title: Sidecars
          description: List of sidecar containers that run alongside the main application container. These will be added to the pod spec as additional containers.
        db_cpu:
          anyOf:
          - type: number
          - type: 'null'
          title: Database CPU
          description: CPU request of the Postgres database deployment. If db_cpu_limit is not set, limit defaults to 2x this value.
        db_cpu_limit:
          anyOf:
          - type: number
          - type: 'null'
          title: Database CPU Limit
          description: CPU limit of the Postgres database deployment. If not set, defaults to 2x db_cpu.
        db_memory_mb:
          anyOf:
          - type: integer
          - type: 'null'
          title: Database Memory (MB)
          description: Memory request (MB) of the Postgres database deployment. If db_memory_limit_mb is not set, limit defaults to 2x this value.
        db_memory_limit_mb:
          anyOf:
          - type: integer
          - type: 'null'
          title: Database Memory Limit (MB)
          description: Memory limit (MB) of the Postgres database deployment. If not set, defaults to 2x db_memory_mb.
        db_storage_gi:
          anyOf:
          - type: integer
          - type: 'null'
          title: Database Storage (GiB)
          description: Storage (GiB) of the Postgres database deployment.
        db_max_connections:
          anyOf:
          - type: integer
          - type: 'null'
          title: Database Max Connections
          description: Maximum number of connections allowed to the Postgres database.
        cpu_target_percent:
          anyOf:
          - type: integer
            maximum: 100.0
            minimum: 1.0
          - type: 'null'
          title: CPU Scaling Target (%)
          description: Average CPU usage, as a percentage of `cpu_limit` (or of `cpu` when `cpu_limit_enabled` is false), at which the autoscaler adds api-server replicas. Required when `cpu_scaling_enabled` is true; must be null when it is false. The scaling override fields (`cpu_target_percent`, `cpu_scaling_enabled`, `cpu_limit_enabled`, `autoscaling_behavior`, and their `queue_` counterparts) must be set all together or not at all. Requires the `ENABLE_LGP_SCALING_OVERRIDES` setting.
        cpu_scaling_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Scale on CPU
          description: Whether the api-server autoscaler scales on CPU. When false, the CPU trigger is removed and, with no other trigger, the api-server keeps its current replica count within `min_scale` and `max_scale`. The scaling override fields (`cpu_target_percent`, `cpu_scaling_enabled`, `cpu_limit_enabled`, `autoscaling_behavior`, and their `queue_` counterparts) must be set all together or not at all. Requires the `ENABLE_LGP_SCALING_OVERRIDES` setting.
        cpu_limit_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: CPU Limit Enabled
          description: Whether the api-server container has a CPU limit. When false, `cpu_limit` must be null. The scaling override fields (`cpu_target_percent`, `cpu_scaling_enabled`, `cpu_limit_enabled`, `autoscaling_behavior`, and their `queue_` counterparts) must be set all together or not at all. Requires the `ENABLE_LGP_SCALING_OVERRIDES` setting.
        autoscaling_behavior:
          anyOf:
          - $ref: '#/components/schemas/HPAScalingBehavior-Output'
          - type: 'null'
          title: Autoscaling Behavior
          description: HorizontalPodAutoscaler scale-up and scale-down behavior for the api-server autoscaler. Both directions are required, each with `stabilization_window_seconds`, `select_policy`, and at least one policy. The scaling override fields (`cpu_target_percent`, `cpu_scaling_enabled`, `cpu_limit_enabled`, `autoscaling_behavior`, and their `queue_` counterparts) must be set all together or not at all. Requires the `ENABLE_LGP_SCALING_OVERRIDES` setting.
        queue_cpu_target_percent:
          anyOf:
          - type: integer
            maximum: 100.0
            minimum: 1.0
          - type: 'null'
          title: Queue CPU Scaling Target (%)
          description: Average CPU usage, as a percentage of `queue_cpu_limit` (or of `queue_cpu` when `queue_cpu_limit_enabled` is false), at which the autoscaler adds queue replicas. Required when `queue_cpu_scaling_enabled` is true; must be null when it is false. The scaling override fields (`cpu_target_percent`, `cpu_scaling_enabled`, `cpu_limit_enabled`, `autoscaling_behavior`, and their `queue_` counterparts) must be set all together or not at all. Requires the `ENABLE_LGP_SCALING_OVERRIDES` setting.
        queue_cpu_scaling_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Queue Scale on CPU
          description: Whether the queue autoscaler scales on CPU. When false, the CPU trigger is removed; under KEDA the queue-depth trigger remains. The scaling override fields (`cpu_target_percent`, `cpu_scaling_enabled`, `cpu_limit_enabled`, `autoscaling_behavior`, and their `queue_` counterparts) must be set all together or not at all. Requires the `ENABLE_LGP_SCALING_OVERRIDES` setting.
        queue_cpu_limit_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Queue CPU Limit Enabled
          description: Whether the queue container has a CPU limit. When false, `queue_cpu_limit` must be null. The scaling override fields (`cpu_target_percent`, `cpu_scaling_enabled`, `cpu_limit_enabled`, `autoscaling_behavior`, and their `queue_` counterparts) must be set all together or not at all. Requires the `ENABLE_LGP_SCALING_OVERRIDES` setting.
        queue_autoscaling_behavior:
          anyOf:
          - $ref: '#/components/schemas/HPAScalingBehavior-Output'
          - type: 'null'
          title: Queue Autoscaling Behavior
          description: HorizontalPodAutoscaler scale-up and scale-down behavior for the queue autoscaler. Both directions are required, each with `stabilization_window_seconds`, `select_policy`, and at least one policy. The scaling override fields (`cpu_target_percent`, `cpu_scaling_enabled`, `cpu_limit_enabled`, `autoscaling_behavior`, and their `queue_` counterparts) must be set all together or not at all. Requires the `ENABLE_LGP_SCALING_OVERRIDES` setting.
      type: object
      title: ResourceSpec
      description: 'Resource specification for the deployment.<br>

        <br>

        When updating a deployment (`PATCH`), setting this field to a non-null value will trigger creation of a new revision and overwrite the existing resource_spec for the deployment. Only applicable for `external_docker` source.'
    Volume:
      properties:
        name:
          type: string
          title: Name
          description: Volume's name. Must be a DNS_LABEL and unique within the pod.
        configMap:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Configmap
          description: ConfigMap represents a configMap that should populate this volume.
        secret:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Secret
          description: Secret represents a secret that should populate this volume.
        emptyDir:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Emptydir
          description: EmptyDir represents a temporary directory that shares a pod's lifetime.
        persistentVolumeClaim:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Persistentvolumeclaim
          description: PersistentVolumeClaim represents a reference to a PersistentVolumeClaim.
        nfs:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Nfs
          description: NFS represents an NFS mount on the host that shares a pod's lifetime.
        projected:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Projected
          description: Projected represents a volume that projects several volume sources into the same directory.
        downwardAPI:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Downwardapi
          description: DownwardAPI represents downward API about the pod that should populate this volume.
        csi:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Csi
          description: CSI represents a volume that should be handled by an external CSI driver.
      type: object
      title: Volume
      description: Kubernetes Volume specification.
