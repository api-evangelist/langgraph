          description: The URL of the git repository used for the deployment.<br><br>When updating a deployment (`PATCH`), set this field to point the deployment at a renamed, transferred, or different repository. The repository must be accessible through one of the workspace's GitHub integrations and contain the deployment's LangGraph configuration file at the tracked git ref. Updating this field does not create a new revision; set `source_revision_config.repo_ref` in the same request to deploy from the new repository. Only applicable for `github` source.
