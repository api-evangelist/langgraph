        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Name of the deployment to filter by.
          title: Name Contains
        description: Name of the deployment to filter by.
      - name: name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Exact deployment name to filter by.
          title: Name
        description: Exact deployment name to filter by.
      - name: status
        in: query
        required: false
