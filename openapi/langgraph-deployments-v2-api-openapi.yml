          description: HorizontalPodAutoscaler scale-up and scale-down behavior for the api-server autoscaler. Both directions are required, each with `stabilization_window_seconds`, `select_policy`, and at least one policy. The scaling override fields (`cpu_target_percent`, `cpu_scaling_enabled`, `cpu_limit_enabled`, `autoscaling_behavior`, and their `queue_` counterparts) must be set all together or not at all. Requires the `ENABLE_LGP_SCALING_OVERRIDES` setting.
        queue_cpu_target_percent:
          anyOf:
          - type: integer
            maximum: 100.0
            minimum: 1.0
          - type: 'null'
          title: Queue CPU Scaling Target (%)
          description: Average CPU usage, as a percentage of `queue_cpu_limit` (or of `queue_cpu` when `queue_cpu_limit_enabled` is false), at which the autoscaler adds queue replicas. Required when `queue_cpu_scaling_enabled` is true; must be null when it is false. The scaling override fields (`cpu_target_percent`, `cpu_scaling_enabled`, `cpu_limit_enabled`, `autoscaling_behavior`, and their `queue_` counterparts) must be set all together or not at all. Requires the `ENABLE_LGP_SCALING_OVERRIDES` setting.
        queue_cpu_scaling_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Queue Scale on CPU
          description: Whether the queue autoscaler scales on CPU. When false, the CPU trigger is removed; under KEDA the queue-depth trigger remains. The scaling override fields (`cpu_target_percent`, `cpu_scaling_enabled`, `cpu_limit_enabled`, `autoscaling_behavior`, and their `queue_` counterparts) must be set all together or not at all. Requires the `ENABLE_LGP_SCALING_OVERRIDES` setting.
        queue_cpu_limit_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Queue CPU Limit Enabled
          description: Whether the queue container has a CPU limit. When false, `queue_cpu_limit` must be null. The scaling override fields (`cpu_target_percent`, `cpu_scaling_enabled`, `cpu_limit_enabled`, `autoscaling_behavior`, and their `queue_` counterparts) must be set all together or not at all. Requires the `ENABLE_LGP_SCALING_OVERRIDES` setting.
        queue_autoscaling_behavior:
          anyOf:
          - $ref: '#/components/schemas/HPAScalingBehavior-Input'
          - type: 'null'
          title: Queue Autoscaling Behavior
