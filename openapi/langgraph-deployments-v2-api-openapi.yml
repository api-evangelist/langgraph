          anyOf:
          - type: string
          - type: 'null'
          description: '`status` of the deployment to filter by.'
          title: Status
        description: '`status` of the deployment to filter by.'
      - name: remote_reconciled
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Flag to filter by remote reconciled deployments.
          title: Remote Reconciled
        description: Flag to filter by remote reconciled deployments.
      - name: tag_value_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma separated list of tag value IDs of the deployment to filter by.
          title: Tag Value Ids
        description: Comma separated list of tag value IDs of the deployment to filter by.
      - name: image_version
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Image version to filter by.
          title: Image Version
        description: Image version to filter by.
      - name: deployment_type
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - dev_free
            - dev
            - prod
            - dev_zero
            - dev_free_zero
            type: string
          - type: 'null'
          description: Deployment type to filter by.
          title: Deployment Type
        description: Deployment type to filter by.
      - name: deployment_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma separated list of deployment IDs to filter by.
          title: Deployment Ids
        description: Comma separated list of deployment IDs to filter by.
      - name: url
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Serving URL of the deployment to filter by.
          title: Url
        description: Serving URL of the deployment to filter by.
      - name: agent_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 63
            pattern: ^[a-z](?:[a-z0-9-]{0,61}[a-z0-9])?$
          - type: 'null'
          description: 'Exact agent ID (slug) to filter by: 1 to 63 lowercase letters, digits, or hyphens, starting with a letter. Requires agent mode.'
          title: Agent Id
        description: 'Exact agent ID (slug) to filter by: 1 to 63 lowercase letters, digits, or hyphens, starting with a letter. Requires agent mode.'
      - name: agent_environment
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - local
            - development
            - staging
            - production
            type: string
          - type: 'null'
          description: Agent environment to filter by. Requires agent mode.
          title: Agent Environment
        description: Agent environment to filter by. Requires agent mode.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentsList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
