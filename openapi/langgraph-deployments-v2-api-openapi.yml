          description: Whether the api-server autoscaler scales on CPU. When false, the CPU trigger is removed and, with no other trigger, the api-server keeps its current replica count within `min_scale` and `max_scale`. The scaling override fields (`cpu_target_percent`, `cpu_scaling_enabled`, `cpu_limit_enabled`, `autoscaling_behavior`, and their `queue_` counterparts) must be set all together or not at all. Requires the `ENABLE_LGP_SCALING_OVERRIDES` setting.
