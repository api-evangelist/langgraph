        source_config:
          $ref: '#/components/schemas/SourceConfig'
        source_revision_config:
          $ref: '#/components/schemas/SourceRevisionConfig'
        secrets:
          items:
            $ref: '#/components/schemas/Secret'
          type: array
          title: Secrets
        secret_references:
          anyOf:
          - items:
              $ref: '#/components/schemas/SecretReference'
            type: array
          - type: 'null'
          title: Secret References
          description: List of Kubernetes Secret references.<br><br>Only applicable for `external_docker` source.
        shareable:
          type: boolean
          title: Shareable
          description: Whether the deployment can be shared with LangSmith users outside the organization.
          default: false
        route_through_gateway:
          type: boolean
          title: Route Through Gateway
          description: Route OpenAI and Anthropic model calls through the LangSmith LLM gateway.
          default: false
        id:
          type: string
          format: uuid
          title: ID
          description: The ID of the deployment.<br><br>This is a read-only field.
        tenant_id:
          type: string
          format: uuid
          title: Tenant ID
          description: The ID of the tenant that owns the deployment.<br><br>This is a read-only field.
        created_at:
          type: string
          format: date-time
          title: Created At
          description: The creation time of the deployment.<br><br>This is a read-only field.
        updated_at:
          type: string
          format: date-time
          title: Updated At
          description: The last update time of the deployment.<br><br>This is a read-only field.
        status:
          type: string
          enum:
          - AWAITING_DATABASE
          - READY
          - UNUSED
          - AWAITING_DELETE
          - AWAITING_FINAL_DELETE
          - UNKNOWN
          title: Status
          description: The status of the deployment.<br><br>This is a read-only field.
        latest_revision_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Latest Revision ID
          description: The ID of the latest revision of the deployment.<br><br>This is a read-only field.
        active_revision_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Active Revision ID
          description: The ID of the current (actively deployed) revision of the deployment.<br><br>This is a read-only field.
        tracer_session_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Tracer Session ID
          description: The ID of the LangSmith tracing project the deployment writes runs to.<br><br>This is a read-only field.
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: URL
          description: The deployment's serving URL, once provisioned.<br><br>This is a read-only field.
        is_preview:
          type: boolean
          title: Is Preview
          description: Whether this is a preview-build deployment. Full preview metadata (parent deployment, PR, lifecycle) is available from the preview-builds details endpoint.<br><br>This is a read-only field.
          default: false
        image_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Version
          description: Image version of the deployment.
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
          description: Human-readable display name for the deployment.
        is_managed_deep_agent:
          type: boolean
          title: Is Managed Deep Agent
          description: Whether this deployment is a Managed Deep Agent deployment.<br><br>This is a read-only field.
          default: false
        deployment_tier:
          anyOf:
          - $ref: '#/components/schemas/DeploymentTier'
          - type: 'null'
          title: Deployment Tier
          description: The selected fixed resource tier for this deployment. Existing deployments without an explicit selection return the default tier for their deployment type. When compute and database tiers differ, this reflects the compute tier. Null when compute has a custom size.
        compute_tier:
          anyOf:
          - $ref: '#/components/schemas/DeploymentTier'
          - type: string
            const: LEGACY_CUSTOM
          - type: 'null'
          title: Compute Tier
          description: The selected fixed resource tier for this deployment's compute. Deployments without an explicit selection return the default tier for their deployment type. `LEGACY_CUSTOM` means the compute has a custom size that matches no tier.
        database_tier:
          anyOf:
          - $ref: '#/components/schemas/DeploymentTier'
          - type: string
            const: LEGACY_CUSTOM
          - type: 'null'
          title: Database Tier
          description: The selected fixed resource tier for this deployment's database. Deployments without an explicit selection return the default tier for their deployment type. `LEGACY_CUSTOM` means the database has a custom size that matches no tier.
      type: object
      required:
      - source
      - source_config
      - source_revision_config
      - secrets
      - id
      - tenant_id
      - created_at
      - updated_at
      - status
      - latest_revision_id
      - active_revision_id
      title: Deployment
      description: Deployment resource.
