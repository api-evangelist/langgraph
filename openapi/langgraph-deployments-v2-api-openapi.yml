        db_cpu:
          anyOf:
          - type: number
          - type: 'null'
          title: Database CPU
          description: CPU request of the Postgres database deployment. If db_cpu_limit is not set, limit defaults to 2x this value.
        db_cpu_limit:
          anyOf:
          - type: number
          - type: 'null'
          title: Database CPU Limit
          description: CPU limit of the Postgres database deployment. If not set, defaults to 2x db_cpu.
        db_memory_mb:
          anyOf:
          - type: integer
          - type: 'null'
          title: Database Memory (MB)
          description: Memory request (MB) of the Postgres database deployment. If db_memory_limit_mb is not set, limit defaults to 2x this value.
        db_memory_limit_mb:
          anyOf:
          - type: integer
          - type: 'null'
          title: Database Memory Limit (MB)
          description: Memory limit (MB) of the Postgres database deployment. If not set, defaults to 2x db_memory_mb.
        db_storage_gi:
          anyOf:
          - type: integer
          - type: 'null'
          title: Database Storage (GiB)
          description: Storage (GiB) of the Postgres database deployment.
        db_max_connections:
          anyOf:
          - type: integer
          - type: 'null'
          title: Database Max Connections
          description: Maximum number of connections allowed to the Postgres database.
        cpu_target_percent:
          anyOf:
          - type: integer
            maximum: 100.0
            minimum: 1.0
          - type: 'null'
          title: CPU Scaling Target (%)
          description: Average CPU usage, as a percentage of `cpu_limit` (or of `cpu` when `cpu_limit_enabled` is false), at which the autoscaler adds api-server replicas. Required when `cpu_scaling_enabled` is true; must be null when it is false. The scaling override fields (`cpu_target_percent`, `cpu_scaling_enabled`, `cpu_limit_enabled`, `autoscaling_behavior`, and their `queue_` counterparts) must be set all together or not at all. Requires the `ENABLE_LGP_SCALING_OVERRIDES` setting.
