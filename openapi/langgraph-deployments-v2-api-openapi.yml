          - type: 'null'
          title: Max Scale
          description: The maximum scale (number of replicas) of the deployment.
        cpu:
          anyOf:
          - type: number
            minimum: 0.1
          - type: 'null'
          maximum: 8.0
          title: CPU
          description: CPU request in cores for a single replica of the deployment. Supports fractional values (e.g. 0.5 for 500m). Values are rounded to 1 decimal place. If cpu_limit is not set, limit defaults to 2x this value unless cpu_limit_enabled is false.
          examples:
          - 0.1
          - 0.5
          - 1
          - 2
          - 4
        cpu_limit:
          anyOf:
          - type: number
            minimum: 0.1
          - type: 'null'
          maximum: 16.0
          title: CPU Limit
          description: CPU limit in cores for a single replica of the deployment. Supports fractional values (e.g. 0.5 for 500m). Values are rounded to 1 decimal place. If not set, defaults to 2x cpu; set cpu_limit_enabled to false to run without a CPU limit.
          examples:
          - 0.2
          - 1
          - 2
          - 4
          - 8
          - 16
        memory_mb:
          anyOf:
          - type: integer
          - type: 'null'
