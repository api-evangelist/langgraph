          minimum: 1.0
          title: Value
          description: Amount of change the policy permits within `period_seconds`. Between 1 and 1000.
        period_seconds:
          type: integer
          maximum: 1800.0
          minimum: 1.0
          title: Period Seconds
          description: Window of time for which the policy holds. Between 1 and 1800 seconds (30 minutes).
