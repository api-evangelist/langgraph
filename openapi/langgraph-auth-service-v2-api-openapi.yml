              schema:
                items:
                  $ref: '#/components/schemas/OAuthProviderResponse'
                type: array
                title: Response List Platform Oauth Providers V2 Auth Platform Providers Get
      security:
      - API Key: []
      - Tenant ID: []
      - Bearer Auth: []
  /v2/auth/platform-providers/{provider_id}:
    get:
      tags:
      - Auth Service (v2)
      summary: Get Platform Oauth Provider
      description: Get a platform-level OAuth provider available to all workspaces.
      operationId: get_platform_oauth_provider_v2_auth_platform_providers__provider_id__get
      security:
      - API Key: []
      - Tenant ID: []
      - Bearer Auth: []
      parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          type: string
          description: OAuth provider ID
          title: Provider Id
        description: OAuth provider ID
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthProviderResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/auth/setup/{provider_id}:
    get:
      tags:
      - Auth Service (v2)
      summary: Oauth Setup Callback
      description: 'Handle OAuth setup callback redirect from GitHub Apps.


        This endpoint handles the "Setup URL" callback from GitHub Apps, which is

        triggered when a user installs or updates their GitHub App installation.


        For "update" actions (user modified repo access via GitHub), we just show

        a success page since no token exchange is needed.


        For new installations with code/state, we process similar to the regular

        OAuth callback.'
      operationId: oauth_setup_callback_v2_auth_setup__provider_id__get
      parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          type: string
          title: Provider Id
      - name: code
        in: query
        required: false
        schema:
          type: string
          description: Authorization code from OAuth provider
          title: Code
        description: Authorization code from OAuth provider
      - name: state
        in: query
        required: false
        schema:
          type: string
          description: State parameter containing auth_id
          title: State
        description: State parameter containing auth_id
      - name: setup_action
        in: query
        required: false
        schema:
          type: string
          description: Setup action from GitHub App
          title: Setup Action
        description: Setup action from GitHub App
      - name: installation_id
        in: query
        required: false
        schema:
          type: integer
          description: GitHub App installation ID
          title: Installation Id
        description: GitHub App installation ID
      - name: error
        in: query
        required: false
        schema:
          type: string
          description: Error code from OAuth provider
          title: Error
        description: Error code from OAuth provider
      - name: error_description
        in: query
        required: false
        schema:
          type: string
          description: Error description from OAuth provider
          title: Error Description
        description: Error description from OAuth provider
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/auth/callback/{provider_id}:
    get:
      tags:
      - Auth Service (v2)
      summary: Oauth Callback Get
      description: 'Handle OAuth callback redirect from OAuth providers.


        Always delegates to the frontend host-oauth-callback when LANGSMITH_URL is

        set — including agent-subject sessions — so finalize goes through the

        authenticated POST callback (org-scoped). Unauthenticated GET never mints

        or binds tokens for agent subjects.'
      operationId: oauth_callback_get_v2_auth_callback__provider_id__get
      security:
      - Bearer Auth: []
      parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          type: string
          title: Provider Id
      - name: code
        in: query
        required: false
        schema:
          type: string
          description: Authorization code from OAuth provider
          title: Code
        description: Authorization code from OAuth provider
      - name: state
        in: query
        required: false
        schema:
          type: string
          description: State parameter containing auth_id
          title: State
        description: State parameter containing auth_id
      - name: error
        in: query
        required: false
        schema:
          type: string
          description: Error code from OAuth provider
          title: Error
        description: Error code from OAuth provider
      - name: error_description
        in: query
        required: false
        schema:
          type: string
          description: Error description from OAuth provider
          title: Error Description
        description: Error description from OAuth provider
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Auth Service (v2)
      summary: Oauth Callback
      description: 'Finalize an OAuth flow.


        Claims the auth request, verifies the caller, exchanges the code, and saves the token.

        Used by both the frontend bridge and the headless flow (where a customer-owned service

        forwards the code/state, optionally proxied through smith-go).


        User-subject sessions require the authenticated caller to match the initiator.

        Agent-subject sessions (MDA Connect) skip that match — start is gated by

        ``deployments:create`` / service key, and the FE bridge may present a different

        same-org workspace session to complete consent — then bind via

        ``host_oauth_agent_connections``.'
      operationId: oauth_callback_v2_auth_callback__provider_id__post
      security:
      - API Key: []
      - Tenant ID: []
      - Bearer Auth: []
      parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          type: string
          title: Provider Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthFinalizeRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/auth/authenticate:
    post:
      tags:
      - Auth Service (v2)
      summary: Authenticate
      description: Get OAuth token or start authentication flow if needed.
      operationId: authenticate_v2_auth_authenticate_post
      requestBody:
        content:
          application/json:
