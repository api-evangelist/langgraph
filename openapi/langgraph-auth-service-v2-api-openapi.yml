              schema:
                $ref: '#/components/schemas/OAuthProviderResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - API Key: []
      - Tenant ID: []
      - Bearer Auth: []
  /v2/auth/providers/{provider_id}:
    get:
      tags:
      - Auth Service (v2)
      summary: Get Oauth Provider
      description: Get a specific OAuth provider.
      operationId: get_oauth_provider_v2_auth_providers__provider_id__get
      security:
      - API Key: []
      - Tenant ID: []
      - Bearer Auth: []
      parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          type: string
          description: OAuth provider ID
          title: Provider Id
        description: OAuth provider ID
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthProviderResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Auth Service (v2)
      summary: Update Oauth Provider
      description: Update an OAuth provider.
      operationId: update_oauth_provider_v2_auth_providers__provider_id__patch
      security:
      - API Key: []
      - Tenant ID: []
      - Bearer Auth: []
      parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          type: string
          title: Provider Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthProviderUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthProviderResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Auth Service (v2)
      summary: Delete Oauth Provider
      description: Delete an OAuth provider.
      operationId: delete_oauth_provider_v2_auth_providers__provider_id__delete
      security:
      - API Key: []
      - Tenant ID: []
      - Bearer Auth: []
      parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          type: string
          title: Provider Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/auth/tokens:
    get:
      tags:
      - Auth Service (v2)
      summary: List Oauth Tokens For User
      description: List the calling user's tokens for a provider.
      operationId: list_oauth_tokens_for_user_v2_auth_tokens_get
      security:
      - API Key: []
      - Tenant ID: []
      - Bearer Auth: []
      parameters:
      - name: provider_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: OAuth provider ID
          title: Provider Id
        description: OAuth provider ID
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OAuthTokenSummary'
                title: Response List Oauth Tokens For User V2 Auth Tokens Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Auth Service (v2)
      summary: Delete Oauth Tokens For User
      description: Delete all tokens for the current user for the given provider (across agents).
      operationId: delete_oauth_tokens_for_user_v2_auth_tokens_delete
      security:
      - API Key: []
      - Tenant ID: []
      - Bearer Auth: []
      parameters:
      - name: provider_id
        in: query
        required: true
        schema:
          type: string
          description: OAuth provider ID to revoke for current user
          title: Provider Id
        description: OAuth provider ID to revoke for current user
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/auth/token-events:
    get:
      tags:
      - Auth Service (v2)
      summary: List Token Events For User
      description: 'List the calling user''s OAuth connection audit events, newest first.


        Backs the frontend "your connection dropped, reconnect" surface. Scoped to

        the authenticated user + org; both come from the auth context, never from

        request input.'
      operationId: list_token_events_for_user_v2_auth_token_events_get
      security:
      - API Key: []
      - Tenant ID: []
      - Bearer Auth: []
      parameters:
      - name: provider_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter to one OAuth provider
          title: Provider Id
        description: Filter to one OAuth provider
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: Max events to return
          default: 50
          title: Limit
        description: Max events to return
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TokenEventSummary'
                title: Response List Token Events For User V2 Auth Token Events Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/auth/tokens/{token_id}/metadata:
    patch:
      tags:
      - Auth Service (v2)
      summary: Update Token Label
      description: Update a token's provider_account_label. Only the token owner can update.
      operationId: update_token_label_v2_auth_tokens__token_id__metadata_patch
      security:
      - API Key: []
      - Tenant ID: []
      - Bearer Auth: []
      parameters:
      - name: token_id
        in: path
        required: true
        schema:
          type: string
          title: Token Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthTokenUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/auth/tokens/import:
    post:
      tags:
      - Auth Service (v2)
      summary: Import Oauth Token
      description: 'Persist a directly-obtained OAuth token (no authorization-code exchange).


        The Slack managed-install flow receives a bot token inline from

        ``apps.managedInstall`` instead of through the browser OAuth redirect. This

        stores it (Fernet-encrypted at rest, via ``create_oauth_token``) for the

        caller''s org/user against an existing provider. Requiring the provider to

        already exist in the caller''s org scopes the write and blocks cross-org

        token creation. The token value is never logged or returned.'
      operationId: import_oauth_token_v2_auth_tokens_import_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthTokenImportRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenImportResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - API Key: []
      - Tenant ID: []
      - Bearer Auth: []
  /v2/auth/tokens/{token_id}:
    delete:
      tags:
      - Auth Service (v2)
      summary: Delete Single Oauth Token
      description: 'Delete a specific OAuth token, revoking it at the provider first.


        Only the token owner can delete it.'
      operationId: delete_single_oauth_token_v2_auth_tokens__token_id__delete
      security:
      - API Key: []
      - Tenant ID: []
      - Bearer Auth: []
      parameters:
      - name: token_id
        in: path
        required: true
        schema:
          type: string
          title: Token Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/auth/tokens/exists:
    get:
      tags:
      - Auth Service (v2)
      summary: Check Oauth Token Exists
      description: Return whether the current user has any tokens for a given provider (across agents).
      operationId: check_oauth_token_exists_v2_auth_tokens_exists_get
      security:
      - API Key: []
      - Tenant ID: []
      - Bearer Auth: []
      parameters:
      - name: provider_id
        in: query
        required: true
        schema:
          type: string
          description: OAuth provider ID
          title: Provider Id
        description: OAuth provider ID
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/auth/tokens/exists/batch:
    post:
      tags:
      - Auth Service (v2)
      summary: Check Oauth Tokens Exist Batch
      description: 'Batch token-presence check: per requested provider, whether the current user has any token.'
      operationId: check_oauth_tokens_exist_batch_v2_auth_tokens_exists_batch_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthTokenStatusBatchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenStatusBatchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - API Key: []
      - Tenant ID: []
      - Bearer Auth: []
  /v2/auth/tokens/workspace/slack/exists:
    get:
      tags:
      - Auth Service (v2)
      summary: Check Workspace Slack Tokens Exist
      description: Check if the workspace has any Slack tokens.
      operationId: check_workspace_slack_tokens_exist_v2_auth_tokens_workspace_slack_exists_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenStatusResponse'
      security:
      - API Key: []
      - Tenant ID: []
      - Bearer Auth: []
  /v2/auth/tokens/workspace/slack:
    delete:
      tags:
      - Auth Service (v2)
      summary: Revoke All Slack Tokens For Workspace
      description: 'Revoke ALL Slack tokens for the workspace. Admin-only action that disconnects Slack entirely.


        This is a destructive operation that:

        - Revokes all Slack tokens on Slack''s side for all users in the workspace

        - Deletes all Slack tokens from the database'
      operationId: revoke_all_slack_tokens_for_workspace_v2_auth_tokens_workspace_slack_delete
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - API Key: []
      - Tenant ID: []
      - Bearer Auth: []
components:
  schemas:
    OAuthTokenStatusBatchResponse:
      properties:
        has_token:
          additionalProperties:
            type: boolean
          type: object
          title: Has Token
      type: object
      required:
      - has_token
      title: OAuthTokenStatusBatchResponse
      description: Per-provider token presence for the current user (provider_id -> has_token).
    OAuthTokenStatusResponse:
      properties:
        has_token:
          type: boolean
          title: Has Token
      type: object
      required:
      - has_token
      title: OAuthTokenStatusResponse
      description: Simple status indicating if a user has a token for a provider/agent.
    AuthStatus:
      type: string
      enum:
      - completed
      - pending
      - connection_required
      - token_expired
      title: AuthStatus
      description: Valid authentication status values.
    OAuthFinalizeRequest:
      properties:
        code:
          type: string
          title: Code
        state:
          type: string
          title: State
      type: object
      required:
      - code
      - state
      title: OAuthFinalizeRequest
      description: Request model for OAuth callback finalization (frontend bridge and headless).
    TokenEventSummary:
      properties:
        id:
          type: string
          title: Id
        provider_id:
          type: string
          title: Provider Id
        agent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Id
        event_type:
          type: string
          title: Event Type
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        source:
          anyOf:
          - type: string
          - type: 'null'
          title: Source
        provider_account_label:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider Account Label
        scopes:
          items:
            type: string
          type: array
