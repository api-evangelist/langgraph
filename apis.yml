aid: langgraph
name: LangGraph
description: >-
  LangGraph is an open-source framework from LangChain for building stateful, multi-actor agent workflows with low-level
  primitives for greater control over agent behavior. LangGraph Platform (LangSmith Deployment) provides managed
  infrastructure for running agents in production with assistants, threads, and runs.
